<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <style>
      .t{font:700 40px "Segoe UI",Arial,sans-serif;fill:#0f172a}
      .s{font:400 19px "Segoe UI",Arial,sans-serif;fill:#475569}
      .num{font:800 30px "Segoe UI",Arial,sans-serif;fill:#ffffff}
      .ct{font:700 25px "Segoe UI",Arial,sans-serif;fill:#0f172a}
      .cd{font:400 17px "Segoe UI",Arial,sans-serif;fill:#334155}
      .chip{font:700 13px "Segoe UI",Arial,sans-serif;fill:#ffffff}
      .who{font:700 13px "Segoe UI",Arial,sans-serif;fill:#334155}
      .bt{font:700 22px "Segoe UI",Arial,sans-serif;fill:#0f172a}
      .bl{font:400 17px "Segoe UI",Arial,sans-serif;fill:#334155}
      .leg{font:600 15px "Segoe UI",Arial,sans-serif;fill:#334155}
      .card{fill:#ffffff;stroke:#cbd5e1;stroke-width:2;rx:16;ry:16}
      .fl{fill:none;stroke:#64748b;stroke-width:4;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <filter id="sh" x="-8%" y="-8%" width="118%" height="126%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect width="1800" height="1250" fill="#f6f9fc"/>
  <text x="60" y="66" class="t">Come funziona Stock Vector Studio</text>
  <text x="60" y="100" class="s">Dal tema all'immagine pubblicata sui siti stock, in 6 passi</text>

  <rect x="1330" y="34" width="410" height="72" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="1352" y="58" width="56" height="26" rx="13" fill="#059669"/>
  <text x="1370" y="76" class="chip">TU</text>
  <text x="1420" y="76" class="leg">scegli e controlli</text>
  <rect x="1580" y="58" width="132" height="26" rx="13" fill="#2563eb"/>
  <text x="1594" y="76" class="chip">AUTOMATICO</text>

  <g filter="url(#sh)">
    <rect x="60" y="150" width="520" height="300" class="card"/>
    <circle cx="112" cy="204" r="30" fill="#059669"/>
    <text x="102" y="215" class="num">1</text>
    <text x="160" y="214" class="ct">Scegli il tema</text>
    <text x="88" y="272" class="cd">Apri Opportunità: vedi cosa conviene creare oggi,</text>
    <text x="88" y="302" class="cd">con la domanda misurata su dati reali e la finestra</text>
    <text x="88" y="332" class="cd">migliore per pubblicare. Copi i prompt già pronti.</text>
    <rect x="88" y="380" width="215" height="34" rx="17" fill="#eef2f7"/>
    <text x="106" y="403" class="who">Scheda: Opportunità</text>
    <rect x="321" y="380" width="56" height="34" rx="17" fill="#059669"/>
    <text x="339" y="403" class="chip">TU</text>
  </g>

  <g filter="url(#sh)">
    <rect x="640" y="150" width="520" height="300" class="card"/>
    <circle cx="692" cy="204" r="30" fill="#059669"/>
    <text x="682" y="215" class="num">2</text>
    <text x="740" y="214" class="ct">Carica le immagini</text>
    <text x="668" y="272" class="cd">Trascini i file JPEG, PNG, WEBP o TIFF nella scheda</text>
    <text x="668" y="302" class="cd">Carica. Scegli la modalità: Vettoriale oppure</text>
    <text x="668" y="332" class="cd">Immagine. Più file caricati insieme formano un job.</text>
    <rect x="668" y="380" width="170" height="34" rx="17" fill="#eef2f7"/>
    <text x="686" y="403" class="who">Scheda: Carica</text>
    <rect x="856" y="380" width="56" height="34" rx="17" fill="#059669"/>
    <text x="874" y="403" class="chip">TU</text>
  </g>

  <g filter="url(#sh)">
    <rect x="1220" y="150" width="520" height="300" class="card"/>
    <circle cx="1272" cy="204" r="30" fill="#2563eb"/>
    <text x="1262" y="215" class="num">3</text>
    <text x="1320" y="214" class="ct">Il sito elabora</text>
    <text x="1248" y="272" class="cd">Vettoriale: ricalco automatico e file pronti per la</text>
    <text x="1248" y="302" class="cd">vendita, SVG + EPS + JPG (AI con Illustrator).</text>
    <text x="1248" y="332" class="cd">Immagine: nessun ricalco, solo JPEG normalizzato.</text>
    <rect x="1248" y="380" width="250" height="34" rx="17" fill="#eef2f7"/>
    <text x="1266" y="403" class="who">Nessuna azione richiesta</text>
    <rect x="1516" y="380" width="132" height="34" rx="17" fill="#2563eb"/>
    <text x="1530" y="403" class="chip">AUTOMATICO</text>
  </g>

  <path d="M580 300 H640" class="fl"/>
  <path d="M1160 300 H1220" class="fl"/>
  <path d="M1480 450 V505 H320 V550" class="fl"/>

  <g filter="url(#sh)">
    <rect x="60" y="550" width="520" height="300" class="card"/>
    <circle cx="112" cy="604" r="30" fill="#2563eb"/>
    <text x="102" y="615" class="num">4</text>
    <text x="160" y="614" class="ct">Controlla i metadati</text>
    <text x="88" y="672" class="cd">Rivedi titolo, keyword e categoria. Il punteggio SEO</text>
    <text x="88" y="702" class="cd">da 0 a 100 segnala cosa migliorare. Gli errori, come</text>
    <text x="88" y="732" class="cd">marchi o troppe keyword, bloccano l'invio.</text>
    <rect x="88" y="780" width="170" height="34" rx="17" fill="#eef2f7"/>
    <text x="106" y="803" class="who">Scheda: Carica</text>
    <rect x="276" y="780" width="56" height="34" rx="17" fill="#059669"/>
    <text x="294" y="803" class="chip">TU</text>
  </g>

  <g filter="url(#sh)">
    <rect x="640" y="550" width="520" height="300" class="card"/>
    <circle cx="692" cy="604" r="30" fill="#d97706"/>
    <text x="682" y="615" class="num">5</text>
    <text x="740" y="614" class="ct">Invia alla pipeline</text>
    <text x="668" y="672" class="cd">Un pulsante deposita i file in SharePoint e avvia la</text>
    <text x="668" y="702" class="cd">catena Azure: AI per titolo e keyword definitivi,</text>
    <text x="668" y="732" class="cd">scrittura EXIF e invio ad Adobe Stock e Freepik.</text>
    <rect x="668" y="780" width="245" height="34" rx="17" fill="#eef2f7"/>
    <text x="686" y="803" class="who">Dopo la tua conferma</text>
    <rect x="931" y="780" width="132" height="34" rx="17" fill="#d97706"/>
    <text x="945" y="803" class="chip">AUTOMATICO</text>
  </g>

  <g filter="url(#sh)">
    <rect x="1220" y="550" width="520" height="300" class="card"/>
    <circle cx="1272" cy="604" r="30" fill="#d97706"/>
    <text x="1262" y="615" class="num">6</text>
    <text x="1320" y="614" class="ct">Segui fino a Pubblicata</text>
    <text x="1248" y="672" class="cd">In Monitoraggio vedi ogni passo dell'immagine. In</text>
    <text x="1248" y="702" class="cd">Pipeline vedi in quale archivio si trova il file. I</text>
    <text x="1248" y="732" class="cd">metadati definitivi tornano e sostituiscono i tuoi.</text>
    <rect x="1248" y="780" width="310" height="34" rx="17" fill="#eef2f7"/>
    <text x="1266" y="803" class="who">Schede: Monitoraggio e Pipeline</text>
    <rect x="1576" y="780" width="132" height="34" rx="17" fill="#d97706"/>
    <text x="1590" y="803" class="chip">AUTOMATICO</text>
  </g>

  <path d="M580 700 H640" class="fl"/>
  <path d="M1160 700 H1220" class="fl"/>

  <g filter="url(#sh)">
    <rect x="60" y="905" width="820" height="215" class="card"/>
    <rect x="60" y="905" width="820" height="8" rx="4" fill="#059669"/>
    <text x="90" y="960" class="bt">Cosa fai tu</text>
    <text x="90" y="1000" class="bl">1. Scegli un tema conveniente nella scheda Opportunità.</text>
    <text x="90" y="1030" class="bl">2. Generi le immagini e le carichi nel sito.</text>
    <text x="90" y="1060" class="bl">3. Rileggi titolo e keyword e correggi gli errori segnalati.</text>
    <text x="90" y="1090" class="bl">4. Premi Invia alla pipeline e confermi.</text>
  </g>

  <g filter="url(#sh)">
    <rect x="920" y="905" width="820" height="215" class="card"/>
    <rect x="920" y="905" width="820" height="8" rx="4" fill="#2563eb"/>
    <text x="950" y="960" class="bt">Cosa fa il sistema al posto tuo</text>
    <text x="950" y="1000" class="bl">Ricalca in vettoriale, genera SVG, EPS e JPG e li salva.</text>
    <text x="950" y="1030" class="bl">Controlla i metadati e blocca ciò che verrebbe rifiutato.</text>
    <text x="950" y="1060" class="bl">Deposita in SharePoint, classifica con AI e scrive gli EXIF.</text>
    <text x="950" y="1090" class="bl">Carica sui siti stock e riporta lo stato finale nel sito.</text>
  </g>

  <rect x="60" y="1150" width="1680" height="66" rx="14" fill="#eef6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="90" y="1180" class="leg">Stati dell'immagine:  In coda  →  In lavorazione  →  Pronta  →  Inviata  →  Pubblicata</text>
  <text x="90" y="1204" class="leg">Senza pipeline puoi comunque scaricare i CSV per Adobe Stock e Freepik e il bundle ZIP, e caricare a mano.</text>
</svg>
