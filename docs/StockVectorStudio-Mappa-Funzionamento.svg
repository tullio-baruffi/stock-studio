<text x="40" y="58" font-size="30" font-weight="700" fill="#16232e">Stock Vector Studio - mappa del funzionamento</text>
<text x="40" y="88" font-size="15" fill="#5a6b7a">Dal JPEG generato con Flow alla pubblicazione su Adobe Stock e Freepik, con le risorse usate in ogni blocco.</text>
<text x="40" y="110" font-size="13" fill="#5a6b7a">Stato verificato il 22 agosto 2026. Le risorse non tracciate nel repository sono segnate con bordo tratteggiato rosso.</text>
